site_name: Sesión clínica POCUS
site_description: Investigación, síntesis y recursos para una sesión clínica sobre ecografía a pie de cama
site_author: Yaiza Díaz del Castillo

theme:
  name: material
  custom_dir: overrides
  language: es
  # Sin selector: el esquema sigue siempre la preferencia del sistema
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  font:
    text: Instrument Sans
    code: JetBrains Mono
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.tabs.link
    - toc.follow
    - navigation.footer

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search:
      lang: es
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Exploración de temas:
      - 01-exploracion/index.md
  - Investigación:
      - 02-investigacion/index.md
  - Síntesis de la charla:
      - 03-sintesis/index.md
  - Recursos:
      - 04-recursos/index.md
      - Créditos de imágenes: 04-recursos/creditos.md
  - Fuentes:
      - 05-fuentes/index.md
