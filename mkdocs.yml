site_name: Sesión clínica POCUS
site_description: Investigación, síntesis y recursos para una sesión clínica sobre ecografía a pie de cama
site_author: Yaiza Díaz del Castillo

theme:
  name: material
  custom_dir: overrides
  language: es
  # Sin selector: el esquema sigue siempre la preferencia del sistema
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  font:
    text: Instrument Sans
    code: JetBrains Mono
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.tabs.link
    - toc.follow
    - navigation.footer

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

plugins:
  - search:
      lang: es
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Exploración de temas:
      - 01-exploracion/index.md
      - Temas candidatos:
          - 1. Parada cardiaca: 01-exploracion/temas/01-parada-cardiaca.md
          - 2. Taponamiento: 01-exploracion/temas/02-taponamiento.md
          - 3. Disnea aguda (BLUE): 01-exploracion/temas/03-disnea-blue.md
          - 4. Líneas B en la ICA: 01-exploracion/temas/04-lineas-b-ica.md
          - 5. Shock indiferenciado: 01-exploracion/temas/05-shock-rush.md
          - 6. Fluidos en la sepsis: 01-exploracion/temas/06-fluidos-sepsis.md
          - 7. TVP con compresión: 01-exploracion/temas/07-tvp-compresion.md
          - 8. Cólico renal: 01-exploracion/temas/08-colico-renal.md
          - 9. Bloqueo de cadera: 01-exploracion/temas/09-bloqueo-cadera.md
          - 10. Estómago y GLP-1: 01-exploracion/temas/10-gastrica-glp1.md
      - Otros temas considerados: 01-exploracion/otros-temas.md
  - Investigación:
      - 02-investigacion/index.md
  - Síntesis de la charla:
      - 03-sintesis/index.md
  - Recursos:
      - 04-recursos/index.md
      - Créditos de imágenes: 04-recursos/creditos.md
  - Fuentes:
      - 05-fuentes/index.md
