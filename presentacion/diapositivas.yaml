# Guion de la presentación: versión definitiva 1.0
# Fuente del contenido: docs/03-sintesis/esquema-diapositivas.md
# Diagramas: docs/assets/diagramas/ (scripts/diagramas/*.py) · Imágenes: docs/assets/img/ (ver creditos.md)
titulo: "Ecografía pulmonar en la disnea aguda y la insuficiencia cardiaca aguda"
subtitulo: "Del protocolo BLUE a la descongestión guiada por líneas B"
autora: "Yaiza Díaz del Castillo"
fecha: "Sesión clínica · 2026"
archivo: sesion-clinica.pptx
diapositivas:
  # ---------- Bloque A · Apertura y fundamento (4,5 min) ----------
  - tipo: portada
    notas: |
      Objetivo de la sesión: que mañana podáis usar el ecógrafo ante un paciente con disnea
      y saber qué mirar, qué concluir y qué no. (0,5 min)

  - tipo: contenido
    titulo: "Caso 1 · «La radiografía no lo aclara»"
    puntos:
      - "Varón de 74 años: HTA, DM, EPOC leve"
      - "Disnea de 4 días, ortopnea. SpO₂ 88 %, FR 28"
      - "Sibilancias difusas y crepitantes basales"
      - "Rx AP en decúbito: ¿redistribución o infiltrado?"
      - "NT-proBNP pendiente: 60–90 min"
      - {texto: "¿Probabilidad de ICA?", sub: ["< 25 %  ·  25–75 %  ·  > 75 %"]}
    fuente: "Caso ficticio con fines docentes"
    notas: |
      (1 min) Votación a mano alzada. No dar la respuesta: se retoma en la diapositiva 10.
      El residente plantea salbutamol y antibiótico «por si acaso» mientras llega el péptido.
      Es la situación típica en la que la clínica y la radiografía no deciden.

  - tipo: tabla
    titulo: "El problema: la clínica y la radiografía fallan"
    cabecera: ["Dato", "Cifra"]
    filas:
      - ["Disnea aguda en urgencias", "≈ 5 % de las visitas; la IC es la 2.ª causa"]
      - ["Tras un ingreso por ICA", "Hasta el 45 % reingresa o muere en 1 año"]
      - ["Ausencia de crepitantes", "LR− de solo 0,51"]
      - ["Radiografía de tórax", "Normal en 1 de cada 5 ICA"]
    fuente: "Kelly 2017 · Gargani 2023 · Wang 2005 · Collins 2006"
    notas: |
      (1 min) En el anciano con insuficiencia respiratoria, el tratamiento inicial es inapropiado
      en uno de cada tres casos, y la mortalidad pasa del 11 % al 25 % (Ray 2006).
      En España, más de uno de cada cinco pacientes reingresa en 30 días (Fernández-Gassó 2017).

  - tipo: imagen
    titulo: "Del aire al agua: líneas A y líneas B"
    imagen: docs/assets/diagramas/lus-espectro-aireacion.png
    pie: "Cuanto menos aire y más agua, más líneas B"
    fuente: "Esquema propio · Demi 2023 · Lichtenstein 1997"
    notas: |
      (1 min) El pulmón aireado no se «ve»: solo produce artefactos.
      La pleura reverbera y da las líneas A (pulmón normal). Cuando los septos subpleurales
      se engrosan de agua aparecen las líneas B. Si confluyen, «pulmón blanco»; si se pierde
      todo el aire, consolidación. Las líneas B reflejan el agua pulmonar extravascular mejor
      que la presión de enclavamiento.

  - tipo: contenido
    titulo: "Qué es (y qué no es) una línea B"
    puntos:
      - "Nace de la pleura y llega al fondo"
      - "Se mueve con el deslizamiento"
      - "Borra las líneas A"
      - "≥ 3 por espacio intercostal = zona positiva"
      - "No es sinónimo de insuficiencia cardiaca"
    imagen: docs/assets/img/lus-lineas-b.jpg
    fuente: "Volpicelli 2012 · Gargani 2023 · Imagen: Safai Zadeh et al., Diagnostics 2024 (CC BY 4.0)"
    notas: |
      (1 min) Las líneas Z (cortas, no llegan al fondo) y las líneas E (enfisema subcutáneo)
      no son líneas B. Una o dos por espacio pueden ser normales en las bases.

  # ---------- Bloque B · Técnica y diagnóstico (7 min) ----------
  - tipo: contenido
    titulo: "Configura el equipo para el pulmón"
    puntos:
      - "Preset pulmonar o abdominal"
      - "Sin armónicos, sin filtros, sin compuesto"
      - "Foco en la pleura, índice mecánico bajo"
      - "Convexa o microconvexa; lineal para la pleura"
      - "Para seguir: misma sonda, preset y postura"
    imagen: docs/assets/img/lus-lineas-a.jpg
    fuente: "Demi 2023 · Gargani 2023 · Platz 2015 · Imagen: Foutzitzi et al., Diagnostics 2025 (CC BY 4.0)"
    notas: |
      (1 min) Es el error técnico más frecuente: los filtros «limpian» precisamente las líneas B.
      La sonda sectorial es motivo de desacuerdo: la EACVI la acepta y el consenso internacional
      no la recomienda. La imagen muestra un pulmón normal con líneas A (paciente pediátrico).

  - tipo: imagen
    titulo: "El protocolo de 8 zonas"
    imagen: docs/assets/diagramas/lus-8-zonas.png
    fuente: "Gargani 2023 (consenso EACVI) · Buessler 2020"
    notas: |
      (1,5 min) Cuatro zonas por hemitórax: anterior superior e inferior, lateral superior e inferior.
      Se cuenta en el peor espacio de cada zona, con clips de unos 6 s. Confluentes: porcentaje de
      pantalla dividido entre 10. Edema = ≥ 3 líneas B por zona en ≥ 2 zonas por hemitórax, bilateral.
      Los protocolos de 4, 8 y 28 zonas tienen umbrales distintos y no intercambiables.

  - tipo: imagen
    titulo: "El protocolo BLUE en un vistazo"
    imagen: docs/assets/diagramas/lus-arbol-blue.png
    fuente: "Simplificado de Lichtenstein 2008 · Lichtenstein 2014"
    notas: |
      (1,5 min) Tres puntos por hemitórax y siete perfiles. Perfil B (líneas B anteriores bilaterales
      con deslizamiento) = edema hemodinámico. El perfil A obliga a mirar las piernas (TEP) y el punto
      PLAPS (neumonía). Perfil A′ con punto pulmón = neumotórax. Acertó el 90,5 % en su estudio
      original de UCI con operadores expertos; en urgencias rinde peor para el TEP (caso 3).

  - tipo: contenido
    titulo: "¿Cuánto rinde? Ecografía frente a Rx y péptidos"
    puntos:
      - "Ecografía: sensibilidad 88 % frente al 73 % de la Rx"
      - "Patrón B: LR+ 7,4 · LR− 0,16"
      - "NT-proBNP < 300 pg/ml: LR− 0,09, para descartar"
      - "LUS + clínica mejora más que Rx + NT-proBNP"
    imagen: docs/assets/diagramas/lus-rendimiento-lus-vs-rx.png
    fuente: "Maw 2019 · Martindale 2016 · Pivetta 2019"
    notas: |
      (1,5 min) El péptido sirve para descartar; la ecografía confirma y descarta.
      En el ECA de Pivetta, añadir la ecografía a la clínica dio un AUC de 0,95, frente a 0,87 con
      Rx y NT-proBNP. Pulmón y corazón a la vez suben la especificidad al 96 % (Popat 2026).
      La VCI aislada no sirve para diagnosticar la ICA (Squizzato 2021).

  - tipo: contenido
    titulo: "Resolución del caso 1"
    puntos:
      - "Pulmón: patrón B en 7 de 8 zonas, pleura fina"
      - "Derrame pleural bilateral pequeño"
      - "FoCUS: FEVI visual muy reducida"
      - "Diurético i.v. sin esperar al péptido"
      - "Sin antibiótico; ecocardiografía reglada"
    imagen: docs/assets/diagramas/lus-probabilidad-bayes.png
    fuente: "Martindale 2016 · Popat 2026 · Køber 2026 (ESC)"
    notas: |
      (1 min) Recuperar la votación de la diapositiva 2. Las sibilancias eran «asma cardial».
      Con una probabilidad pretest del 40 %, el patrón B la eleva a ≈ 83 % (cálculo propio con el LR+ de 7,4).
      Después, ecocardiografía reglada y NT-proBNP con el punto de corte por edad.

  - tipo: mensaje
    texto: "Patrón para diagnosticar"
    subtexto: "Líneas B difusas y bilaterales + FoCUS confirman la ICA mejor que la radiografía"
    notas: (0,5 min) Pausa.

  # ---------- Bloque C · Diferencial y descongestión (5 min) ----------
  - tipo: contenido
    titulo: "Caso 3 · Pulmón normal, paciente que no respira bien"
    puntos:
      - "Disnea aguda con perfil A bilateral"
      - "Compresión venosa: femoral no compresible"
      - "Perfil A + TVP → TEP (especificidad 99 %)"
      - "Perfil A sin TVP no descarta el TEP"
      - "Multiórgano: sensibilidad del 90 %"
    imagen: docs/assets/img/lus-tvp-femoral-no-compresible.png
    fuente: "Lichtenstein 2008 · Bekgoz 2019 · Nazerian 2014 · Imagen: J. Heilman, Wikimedia Commons (CC BY-SA 4.0)"
    notas: |
      (1 min) En urgencias, la sensibilidad del BLUE para el TEP cae al 46 % (Bekgoz 2019).
      Variante opcional: líneas B focales con consolidación y pleura irregular son neumonía,
      no edema (Padrao 2025; Copetti 2008).

  - tipo: mensaje
    texto: "Perfil A: mira las piernas y el corazón"
    notas: (0,5 min) Pausa.

  - tipo: contenido
    titulo: "Caso 2 · «Mañana se va de alta»"
    puntos:
      - "ICA en mejoría; «seco» a la auscultación"
      - "Hasta el 41 % de los «secos» tiene congestión"
      - "Líneas B al alta: HR 2,32 de reingreso o muerte"
      - "ESC 2026: descartar congestión al alta (I C)"
      - "Objetivo ESC con LUS: < 5 líneas B"
    imagen: docs/assets/diagramas/lus-8-zonas-congestion-residual.png
    fuente: "Rivas-Lasarte 2020 · Suhardi 2025 · Køber 2026 · Gargani 2023"
    notas: |
      (1,5 min) Pregunta: «¿la dais de alta?». La ESC 2026 incluye por primera vez la LUS entre las
      herramientas de descongestión al alta: óptimo < 5 líneas B (28 u 8 zonas), aceptable < 15 (28 zonas).
      Con el protocolo de 8 zonas de la EACVI, congestión residual = ≥ 1 zona positiva en cada
      hemitórax: decid siempre qué protocolo usáis. El hallazgo cambia el plan de alta
      (diurético y revisión a 1–2 semanas).

  - tipo: imagen
    titulo: "¿Guiar el diurético por las líneas B?"
    imagen: docs/assets/diagramas/lus-forest-metaanalisis.png
    pie: "Menos visitas urgentes, hospitalización discutida, mortalidad sin cambios"
    fuente: "Mhanna 2022 · Al-Sagban 2026 · Chotalia 2026 · Bagheri 2026"
    notas: |
      (1,5 min) Ensayos sobre todo ambulatorios o tras el alta. Durante el ingreso, los pilotos fueron
      negativos (BLUSHED-AHF, DMP-Plus), y la ESC 2026 guía el diurético por el sodio urinario
      (IIb B1), no por las líneas B. Al-Sagban usa efectos fijos y tiene una carta crítica publicada.
      Pronóstico no es beneficio. Ensayos en marcha: ICARUS y ABDOPOCUS-HF (España).

  - tipo: mensaje
    texto: "Número para seguir la evolución, y al alta"
    notas: (0,5 min) Pausa.

  # ---------- Bloque D · Integración y cierre (3,5 min) ----------
  - tipo: imagen
    titulo: "Algoritmo práctico"
    imagen: docs/assets/diagramas/lus-algoritmo-disnea.png
    fuente: "Síntesis docente · Qaseem 2021 (ACP) · Gargani 2023 · Lichtenstein 2008 · Martindale 2016"
    notas: |
      (1 min) A quién: disnea aguda con incertidumbre diagnóstica (ACP: condicional, certeza baja).
      Cuándo: lo antes posible, idealmente antes del diurético. Aplicarlo por sistema a toda disnea
      no acortó la estancia (Ovesen 2026); el beneficio es llegar antes al diagnóstico y al
      tratamiento correcto (Szabó 2023).

  - tipo: tabla
    titulo: "Qué dicen las guías"
    cabecera: ["Documento", "Qué dice", "Fuerza"]
    filas:
      - ["ESC IC 2026", "LUS en el algoritmo diagnóstico y al alta (< 5 líneas B)", "Sin clase propia"]
      - ["ESC IC 2026", "Descartar congestión persistente antes del alta", "I C"]
      - ["EACVI 2023", "LUS «apropiada»; protocolo de 8 zonas", "Consenso"]
      - ["ACP 2021 · SCCM 2024", "POCUS si hay incertidumbre diagnóstica", "Condicional, certeza baja"]
      - ["SEMI 2025 · SEMI/SEC/S.E.N. 2024", "Posicionamiento y escala de congestión", "Sin gradación"]
    fuente: "Køber 2026 · Gargani 2023 · Qaseem 2021 · Díaz-Gómez 2025 · Tung-Chen 2025 · Llàcer 2024"
    notas: |
      (1 min) La laguna: ninguna guía recomienda con clase guiar el diurético por las líneas B durante
      el ingreso. La ESC 2026 cambia la terminología a «IC descompensada» y guía el diurético por el
      sodio urinario (IIb B1).

  - tipo: contenido
    titulo: "Errores frecuentes y cómo empezar"
    puntos:
      - "Líneas B ≠ IC: SDRA, neumonía, fibrosis, COVID-19"
      - "Una zona aislada no es edema"
      - "Sin líneas B no se descarta la IC"
      - "Sin deslizamiento ≠ neumotórax: busca el punto pulmón"
      - "Empezar: 5–20 exploraciones supervisadas"
    imagen: docs/assets/diagramas/lus-cardiogenico-vs-no.png
    fuente: "Copetti 2008 · Chiem 2015 · Johannessen 2023 · Lichtenstein 2014 · Russell 2020"
    notas: |
      (1 min) En la EPOC, la sensibilidad de la LUS para una IC concurrente es solo del 17 %.
      Para seguir a un paciente, no cambiéis nada del protocolo. La integración clínica es lo que
      más tarda en aprenderse. Documentad zonas, método y clips.

  - tipo: mensaje
    texto: "1 · Patrón para diagnosticar\n2 · Perfil A: mira las piernas\n3 · Número para seguir"
    subtexto: "Con 5 minutos y un ecógrafo, el paciente del caso 1 habría recibido su diurético antes"
    notas: |
      (0,5 min) Volver al caso 1. El diagnóstico se adelanta unos 60 minutos y el tratamiento
      unos 30 (Szabó 2023).

  - tipo: referencias
    titulo: "Bibliografía clave"
    referencias:
      - "Gargani L, et al. Lung ultrasound in acute and chronic heart failure (EACVI). Eur Heart J Cardiovasc Imaging. 2023;24:1569-82"
      - "Demi L, et al. New International Guidelines and Consensus on the Use of Lung Ultrasound. J Ultrasound Med. 2023;42:309-44"
      - "Køber L, et al. 2026 ESC Guidelines for the management of heart failure. Eur Heart J. 2026. doi:10.1093/eurheartj/ehag100"
      - "Qaseem A, et al. Point-of-care ultrasonography in acute dyspnea (ACP). Ann Intern Med. 2021;174:985-93"
      - "Lichtenstein DA, Mezière GA. The BLUE protocol. Chest. 2008;134:117-25"
      - "Maw AM, et al. Lung ultrasound vs chest radiography in ADHF: SR/MA. JAMA Netw Open. 2019;2:e190703"
      - "Martindale JL, et al. Diagnosing acute heart failure in the ED. Acad Emerg Med. 2016;23:223-42"
      - "Pivetta E, et al. Lung ultrasound integrated with clinical assessment for ADHF: RCT. Eur J Heart Fail. 2019;21:754-66"
      - "Szabó GV, et al. POCUS in acute onset dyspnea: SR/MA. Intern Emerg Med. 2023;18:639-53"
      - "Al-Sagban A, et al. Lung ultrasound-guided decongestion: SR/MA of RCTs. J Crit Care. 2026;93:155435"
      - "Rivas-Lasarte M, et al. Subclinical pulmonary congestion at discharge in AHF. ESC Heart Fail. 2020;7:2621-8"
      - "Suhardi KF, et al. Residual B-lines and cardiovascular events in AHF: SR/MA. Indian Heart J. 2025;77:258-66"
    notas: Bibliografía completa en la web del proyecto (sección Fuentes).
